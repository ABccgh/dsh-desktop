<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>DSH Desktop</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #101418;
        color: #e6e9ef;
        font: 14px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      main { max-width: 40rem; padding: 2rem; text-align: center; }
      h1 { margin: 0 0 1.25rem; font-size: 1.35rem; font-weight: 600; letter-spacing: 0.01em; }
      .spinner {
        width: 28px; height: 28px; margin: 0 auto 1.25rem;
        border: 2px solid #2c333d; border-top-color: #5b9dff; border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #status { margin: 0; color: #aab2bf; white-space: pre-wrap; }
      #status.error { color: #ff8b8b; }
      #hint { margin: 1.25rem 0 0; font-size: 12px; color: #6b7482; }
      body.error .spinner { display: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="spinner"></div>
      <h1>DSH Desktop</h1>
      <p id="status">Starting DeepSeek Harness…</p>
      <p id="hint"></p>
    </main>
    <script>
      /**
       * Status sink for the main process. The main process calls this through
       * `webContents.executeJavaScript`, so there is no preload script and no
       * node integration in this page.
       */
      window.__dshSetStatus = function (text, isError) {
        var status = document.getElementById('status');
        status.textContent = text;
        status.classList.toggle('error', Boolean(isError));
        document.body.classList.toggle('error', Boolean(isError));
        document.getElementById('hint').textContent = isError
          ? 'The log has the full output. See Help → Show Log Folder in the menu.'
          : '';
      };
    </script>
  </body>
</html>
